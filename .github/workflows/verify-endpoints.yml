name: Verify public endpoints

on:
  schedule:
    - cron: "0 9 * * 1" # chaque lundi 09:00 UTC (parcs ouverts : WaitTimes non vide)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Appel des endpoints publics (WaitTimes, GraphQL, CDN)
        shell: bash # -eo pipefail : le job échoue si le script renvoie 1
        run: python tools/verify_endpoints.py --json | tee report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endpoint-report
          path: report.json
